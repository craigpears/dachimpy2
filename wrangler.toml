# Cloudflare Worker: serves the static site and the leaderboard API (worker/index.js).
name = "dachimpy2"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# The site's files. Anything listed in .assetsignore stays private.
[assets]
directory = "."
binding = "ASSETS"

# The leaderboard. Create a D1 database called carpentry-primer in the Cloudflare dashboard
# (its ID is below). The table is made on first use, so there's nothing else to run.
[[d1_databases]]
binding = "DB"
database_name = "carpentry-primer"
database_id = "f53b7cb9-0282-49bf-b4d8-008629c473f7"
